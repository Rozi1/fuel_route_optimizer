<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Optimizer</title>
  <style>
    :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --accent:#1f6feb; --border:#e4e4df; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--text); background:var(--bg); }
    main { max-width:640px; margin:48px auto; padding:0 16px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p { color:var(--muted); margin:0 0 20px; }
    label { display:block; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; }
    .row { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
    button { padding:10px 16px; border-radius:8px; border:1px solid var(--accent); font:inherit; cursor:pointer;
             background:var(--accent); color:#fff; }
    button.secondary { background:#fff; color:var(--accent); }
    h2 { font-size:15px; margin:28px 0 8px; }
    code { background:#eee; padding:2px 5px; border-radius:4px; font-size:13px; }
    ul { padding-left:18px; color:var(--muted); }
    a { color:var(--accent); }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Fuel Route Optimizer</h1>
    <p>Cheapest fuel stops between two US locations · 500 mi range · 10 MPG</p>
    <form id="f" method="get" action="{% url 'route-map' %}">
      <label for="start">Start</label>
      <input id="start" name="start" value="New York, NY" placeholder="City, ST or lat,lon" required>
      <label for="finish">Finish</label>
      <input id="finish" name="finish" value="Los Angeles, CA" placeholder="City, ST or lat,lon" required>
      <div class="row">
        <button type="submit">Show route map</button>
        <button type="submit" class="secondary" formaction="{% url 'route-plan' %}">View JSON</button>
      </div>
    </form>
    <h2>API</h2>
    <ul>
      <li><code>GET /api/route/?start=…&amp;finish=…</code> (or <code>POST</code> JSON)</li>
      <li><code>GET /api/route/map/?start=…&amp;finish=…</code>: interactive map</li>
      <li>Optional: <code>corridor_miles</code>, <code>stop_penalty</code>, <code>start_fuel_gallons</code></li>
    </ul>
  </div>
</main>
</body>
</html>
